name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and component tests
        run: npx vitest run
        env:
          NODE_ENV: test
          # The proxy tests expect a configured upstream key; no real calls are made.
          GEMINI_API_KEY: ci-placeholder-key

      - name: Production build
        run: npx vite build
